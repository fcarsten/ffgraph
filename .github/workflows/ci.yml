name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24-04:
    name: Ubuntu 24.04 / C++17
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev \
            xvfb xauth

      - name: Configure (Debug)
        run: cmake --preset debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build --preset debug --parallel 2

      - name: Run tests (including Xvfb GUI tests)
        run: ctest --preset debug --output-on-failure --parallel 2

  ubuntu-24-04-asan:
    name: Ubuntu 24.04 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev \
            xvfb xauth

      - name: Configure (ASan/UBSan)
        run: cmake --preset asan -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build --preset asan --parallel 2

      - name: Run sanitizer tests (including Xvfb GUI tests)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset asan --output-on-failure --parallel 1

  legacy-gml-fallback:
    name: Legacy GML fallback / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install parser and GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev
      - name: Configure retained legacy GML backend
        run: >-
          cmake -S . -B build/gml-legacy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DFFGRAPH_GML_BACKEND=legacy
          -DFFGRAPH_ENABLE_MODERN_GML=ON
      - name: Build fallback and parity regressions
        run: >-
          cmake --build build/gml-legacy --parallel 2
          --target test_gml_production_backend_pass11
          test_gml_differential_corpus_pass11 test_graph_io_pass10
      - name: Validate fallback and format round trips
        run: >-
          ctest --test-dir build/gml-legacy --output-on-failure
          -R '^test_(gml_production_backend_pass11|gml_differential_corpus_pass11|graph_io_pass10)$'
