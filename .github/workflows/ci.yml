name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24-04:
    name: Ubuntu 24.04 / C++17 / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev \
            xvfb xauth

      - name: Configure
        # Enable the isolated Rome targets; production still uses legacy Rome.
        run: cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=ON -DFFGRAPH_ENABLE_MODERN_ROME_PILOT=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Run tests (including Xvfb GUI tests)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --parallel 2

  ubuntu-24-04-asan:
    name: Ubuntu 24.04 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev \
            xvfb xauth

      - name: Configure (ASan/UBSan)
        run: cmake --preset asan -DBUILD_TESTING=ON -DFFGRAPH_ENABLE_MODERN_ROME_PILOT=ON

      - name: Build
        run: cmake --build --preset asan --parallel 2

      - name: Run headless tests with strict ASan/UBSan and leak checks
        run: ctest --preset asan-headless --parallel 1 --output-log build/asan/headless.log

      - name: Run Xvfb GUI tests with ASan/UBSan runtime checks
        if: ${{ !cancelled() }}
        run: ctest --preset asan-gui --parallel 1 --output-log build/asan/gui-runtime.log

      # Ubuntu Tk/Xft/fontconfig leaks also reproduce without ffgraph. Keep
      # their strict results visible; this step alone is diagnostic. The two
      # mandatory steps above still fail on headless leaks or runtime errors.
      - name: Report strict Xvfb GUI leak diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ctest --preset asan-gui-leaks --parallel 1 --output-log build/asan/gui-leaks.log

      - name: Preserve sanitizer test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-logs
          path: |
            build/asan/*.log
            build/asan/Testing/Temporary/
