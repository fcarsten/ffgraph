# Generator and differential checks for the default modern production GML
# backend and the temporarily retained GTControl fallback.
name: Modern GML generator and parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install modern parser generators
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build bison flex
      - name: Configure standalone parser (no Tcl/Tk required)
        run: cmake -S tests/modern_gml -B build/modern-gml -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Regenerate and compile
        run: cmake --build build/modern-gml --parallel 2 --verbose
      - name: Run parser corpus
        run: ctest --test-dir build/modern-gml --output-on-failure
      - name: Configure sanitizer parser test
        run: >-
          cmake -S tests/modern_gml -B build/modern-gml-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DFFGRAPH_MODERN_GML_SANITIZERS=ON
      - name: Compile sanitizer parser test
        run: cmake --build build/modern-gml-asan --parallel 2
      - name: Run parser corpus with ASan/UBSan and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/modern-gml-asan --output-on-failure

  graph-output-parity:
    # Separate from the Tcl-free pilot: builds the historical importer and
    # compares real FFGraphClass nodes/edges to modern event replay.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install graph build and generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev
      - name: Configure opt-in modern GML graph comparison
        run: >-
          cmake -S . -B build/gml-parity -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DFFGRAPH_ENABLE_MODERN_GML=ON
          -DFFGRAPH_ENABLE_CORPUS_LAYOUT_TESTS=ON
      - name: Build differential and metamorphic layout tests
        run: >-
          cmake --build build/gml-parity --parallel 2
          --target test_gml_graph_parity_pass11 test_graph_corpus_metamorphic_pass11 test_gml_differential_corpus_pass11 test_gml_semantic_atomicity_pass11 test_gml_production_backend_pass11
      - name: Compare graph outputs and metamorphic invariants
        run: >-
          ctest --test-dir build/gml-parity
          -R '^test_(gml_graph_parity|graph_corpus_metamorphic|gml_differential_corpus|gml_differential_metamorphic|gml_semantic_atomicity|gml_production_backend)_pass11$'
          --output-on-failure
      - name: Configure differential test with ASan/UBSan
        run: >-
          cmake -S . -B build/gml-parity-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DFFGRAPH_ENABLE_MODERN_GML=ON
          -DFFGRAPH_ENABLE_CORPUS_LAYOUT_TESTS=ON -DFFGRAPH_SANITIZERS=ON
      - name: Build sanitizer differential and metamorphic tests
        run: >-
          cmake --build build/gml-parity-asan --parallel 2
          --target test_gml_graph_parity_pass11 test_graph_corpus_metamorphic_pass11 test_gml_differential_corpus_pass11 test_gml_semantic_atomicity_pass11 test_gml_production_backend_pass11
      - name: Check graph-output parity and metamorphic invariants under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build/gml-parity-asan
          -R '^test_(gml_graph_parity|graph_corpus_metamorphic|gml_differential_corpus|gml_differential_metamorphic|gml_semantic_atomicity|gml_production_backend)_pass11$'
          --output-on-failure

  comprehensive-gml-standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install generators and legacy graph dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            tcl-dev tk-dev libx11-dev libxpm-dev
      - name: Configure standard differential corpus
        run: >-
          cmake -S . -B build/gml-diff-standard -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DFFGRAPH_ENABLE_MODERN_GML=ON
          -DFFGRAPH_GML_DIFFERENTIAL_PROFILE=standard
      - name: Compile differential corpus harness
        run: >-
          cmake --build build/gml-diff-standard --parallel 2
          --target test_gml_differential_corpus_pass11
      - name: Run standard graph and metamorphic parity checks
        run: >-
          ctest --test-dir build/gml-diff-standard
          -R '^test_gml_differential_.*_pass11$' --output-on-failure
